services:
  frontend:
    container_name: edusport-frontend
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount only the code, not node_modules or .next
      - .:/app
      # Use a named volume to persist container-installed node_modules
      - node_modules:/app/node_modules
      # Persist .next build cache (optional, speeds up rebuilds)
      - next_cache:/app/.next
    command: npm run dev

volumes:
  node_modules:
  next_cache:
