# Production compose file for the Next.js frontend.
# The dev image lives in docker-compose.yml; this file is only used on the VM.
# The reverse proxy (defined in the backend repo) joins the same external
# network and is the only service with published ports on the host.

services:
  frontend:
    container_name: edusport-frontend
    build:
      context: .
      dockerfile: Dockerfile.production
      # NEXT_PUBLIC_* vars must be available during `next build` so they get
      # inlined into the client bundle (and so next.config.ts can whitelist the
      # Strapi image host). Compose substitutes from .env.production at build.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        NEXT_PUBLIC_STRAPI_IMAGE_HOST: ${NEXT_PUBLIC_STRAPI_IMAGE_HOST}
        NEXT_PUBLIC_COMMIT_SHA: ${NEXT_PUBLIC_COMMIT_SHA:-}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    ports:
      # Bound to VM loopback only. nginx on the host reverse-proxies the
      # public domain to this port.
      - "127.0.0.1:3000:3000"
    networks:
      - edusport_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edusport_net:
    external: true
